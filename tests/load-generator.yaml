apiVersion: v1
kind: Pod
metadata:
  name: load-generator
spec:
  restartPolicy: Never
  containers:
    - name: load
      image: busybox:1.36
      command: ["/bin/sh", "-c"]
      args:
        - |
          for i in 1 2 3 4 5 6; do
            (while true; do wget -q -O- http://flask-service:5000/data > /dev/null; done) &
          done
          wait
